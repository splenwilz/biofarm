# Render Blueprint for the Biofarm lead-capture API (api/ subdirectory).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: biofarm-api
    runtime: python
    rootDir: api
    region: frankfurt # closest region to the UK
    # Starter ($7/mo) keeps the service warm - free tier spins down after 15 min
    # idle and cold-starts ~60s, which loses form submissions in practice.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Migrations run before the server binds; additive-only migrations keep the
    # brief old/new instance overlap of zero-downtime deploys safe.
    # --proxy-headers: Render terminates TLS at its proxy; this restores the
    # https scheme. Client IPs for rate limiting come from the edge-set
    # True-Client-IP header (see routes/leads.py), NOT from X-Forwarded-For,
    # whose leftmost entry is client-forgeable.
    # One uvicorn process, no --workers: the Pipedrive mirror import and the
    # dashboard payload cache live in the process (see api/README.md), so more
    # workers would mean more schedulers and more caches.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # Leads live in SQLite on a persistent disk (~$0.25/mo) rather than managed
    # Postgres - right-sized for form volume; swap DATABASE_URL to a Postgres
    # URL later if reporting outgrows it. Note: services with disks don't get
    # zero-downtime deploys (brief restart blip is fine for this API).
    disk:
      name: leads-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/leads.db
      - key: BIOFARM_ENVIRONMENT
        value: production
      - key: BIOFARM_AUTO_CREATE_TABLES
        value: "false"
      # Secrets: Render prompts for these in the dashboard on Blueprint creation.
      - key: BIOFARM_PIPEDRIVE_COMPANY_DOMAIN
        sync: false
      - key: BIOFARM_PIPEDRIVE_API_TOKEN
        sync: false
      # For the marketing dashboard (see api/README.md, "Dashboard feed"):
      #   BIOFARM_DASHBOARD_TOKEN              (shared secret the dashboard's server sends; generate, never commit)
      #   BIOFARM_MIRROR_IMPORT_MINUTES=15     (the Pipedrive mirror import runs inside this process; a cron
      #                                         job cannot reach the disk this SQLite database lives on)
      #   BIOFARM_PIPEDRIVE_WEBSITE_CHANNEL=1037 (without it website leads and their deals have no Source channel)
      #   BIOFARM_ENQUIRY_TEST_DOMAINS / BIOFARM_ENQUIRY_TEST_EMAILS (the team's own test addresses, JSON lists)
      # Optional - set in the dashboard when ready:
      #   BIOFARM_PIPEDRIVE_OWNER_ID           (fallback user id for leads the owner map doesn't cover)
      #   BIOFARM_PIPEDRIVE_OWNER_MAP          (JSON: "<form>" or "<form>:<field>" -> user id, see api/README.md)
      #   BIOFARM_PIPEDRIVE_LEAD_LABEL_IDS     (JSON array of label UUIDs)
      #   BIOFARM_PIPEDRIVE_LEAD_FIELD_MAP     (JSON from scripts/setup_pipedrive_fields.py)
      #   BIOFARM_GA4_MEASUREMENT_ID           (G-3MS9TLLZRN)
      #   BIOFARM_GA4_API_SECRET               (GA4 Admin > Data streams > MP API secrets)

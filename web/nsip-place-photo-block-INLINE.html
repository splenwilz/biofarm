<!-- Infrastructure BNG page · "Good for nature. Good for the place around it." — the RIGHT column:
     Lesnewth photo (already on the Squarespace CDN) with the section's last line pulled out as a white
     card hanging off the bottom-left corner. Paste into ONE Code Block in the right-hand column; the copy
     (H2, lead, two paragraphs) stays as native text blocks on the left.
     The card hangs 48px below the photo and 28px to its left; that overhang is inside this block's box,
     so give the Code Block the full height it asks for and nothing gets clipped.
     MOBILE: in the Fluid Engine phone layout drag this block to the END of the section (after the last
     paragraph) — the card's line is the last line of the copy, so it should read last.
     Copy verbatim from the NSIP brief (page copy v2). Self-contained: own CSS + font. -->
<style>
  @font-face{font-family:'RATI_v2';
    src:url('https://static1.squarespace.com/static/69145a3301c5b8505ba96fac/t/692088b0f9ba550c5a4e78c6/1763739824272/BauhausRatiDisplay-ExtraLight_v2.woff2') format('woff2'),
        url('https://static1.squarespace.com/static/69145a3301c5b8505ba96fac/t/692088b088163d1f94c51715/1763739824273/BauhausRatiDisplay-ExtraLight_v2.woff') format('woff');
    font-weight:300;font-display:swap;}
  .bf-photo{box-sizing:border-box;margin:0;padding:0 0 48px 28px;max-width:588px;margin-left:auto;}
  .bf-photo *,.bf-photo *::before,.bf-photo *::after{box-sizing:border-box;}
  .bf-photo figure{position:relative;margin:0;}
  .bf-photo img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:24px;}
  .bf-photo figcaption{position:absolute;left:-28px;bottom:-40px;max-width:min(78%,380px);background:#fff;border-radius:20px;padding:26px 30px;
    font-family:'RATI_v2',Georgia,serif;font-weight:300;font-size:clamp(22px,1.9vw,28px);line-height:1.3;letter-spacing:0;color:#111;
    box-shadow:0 10px 40px rgba(17,17,17,.08);}
  @media(max-width:900px){
    /* phones: card sits in flow under the photo with a small overlap, so the photo stays visible */
    .bf-photo{padding:0;max-width:none;margin-left:0;}
    .bf-photo img{aspect-ratio:4/3;}
    .bf-photo figcaption{position:relative;z-index:1;left:auto;bottom:auto;margin:-28px 16px 0;max-width:none;padding:18px 20px;font-size:19px;}
  }
</style>
<div class="bf-photo">
  <figure>
    <img src="https://images.squarespace-cdn.com/content/v1/6818f9d9bff1414041f33bf3/1789577922276-SZV6U03RYE82IJUA2LBH/Lesnewth+Skiddy+Activation.jpg?format=1500w" alt="Four people around a freshly dug planting hole on the grassland at Lesnewth habitat bank, with cattle grazing on the hill behind" loading="lazy" />
    <figcaption>For people living alongside major infrastructure, those things matter.</figcaption>
  </figure>
</div>

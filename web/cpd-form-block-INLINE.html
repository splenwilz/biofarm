<!-- CPD page · "Arrange a session" form. Paste into ONE Squarespace Code Block in the right-hand
     column of the "Arrange a session" section (cream background). Self-contained: own CSS + font.
     Posts to the lead-capture API at https://biofarm-api.onrender.com/v1/leads/cpd, which stores the
     lead and syncs it to Pipedrive as a person + lead ("CPD session request - <name>") + note holding
     company, role, team size and the session request; the field chips set the Client Type person field. Same spam checks and UTM attribution as the
     contact form (needs attribution-injection.html, already live site-wide).
     ⚠ Requires the API change in api/ (CpdSubmission + /v1/leads/cpd) to be DEPLOYED first — until
       then the form will show the error message on submit.
     Analytics: pushes dataLayer event pipedrive_form_submit with formId "bng-cpd" (distinct from the
     contact form so Amanda can give it its own GTM trigger) and gtag generate_lead
     (lead_source website_cpd_form). Built 5 Oct 2026. -->
<style>
  @font-face{font-family:'RATI_v2';src:url('https://static1.squarespace.com/static/69145a3301c5b8505ba96fac/t/692088b0f9ba550c5a4e78c6/1763739824272/BauhausRatiDisplay-ExtraLight_v2.woff2') format('woff2');font-weight:300;font-display:swap;}
  .bf-cpdf{--ink:#111;--muted:#5b5f57;--green:#71977A;box-sizing:border-box;background:#fff;border:1px solid rgba(17,17,17,.12);border-radius:24px;padding:clamp(28px,3.5vw,48px);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-weight:300;}
  .bf-cpdf *,.bf-cpdf *::before,.bf-cpdf *::after{box-sizing:border-box;}
  .bf-cpdf .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 24px;}
  .bf-cpdf .full{grid-column:1/-1;}
  .bf-cpdf label{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:400;color:var(--muted);margin:0 0 8px;}
  .bf-cpdf label .req{color:var(--green);}
  .bf-cpdf input,.bf-cpdf select,.bf-cpdf textarea{width:100%;font-family:inherit;font-weight:300;font-size:17px;line-height:1.5;color:var(--ink);background:transparent;border:0;border-bottom:1px solid rgba(17,17,17,.35);border-radius:0;padding:10px 0;margin:0;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none;}
  .bf-cpdf select{background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'%3E%3Cpath d='M1 1l6 6 6-6' fill='none' stroke='%23111' stroke-width='1.5'/%3E%3C/svg%3E") right center no-repeat;padding-right:24px;cursor:pointer;}
  .bf-cpdf input:focus,.bf-cpdf select:focus,.bf-cpdf textarea:focus{border-bottom-color:var(--ink);}
  .bf-cpdf textarea{min-height:110px;resize:vertical;}
  .bf-cpdf fieldset{border:0;margin:0;padding:0;min-width:0;}
  .bf-cpdf legend{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:400;color:var(--muted);margin:0 0 10px;padding:0;}
  .bf-cpdf .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .bf-cpdf .chips label{display:inline-flex;align-items:center;margin:0;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);padding:10px 16px;border-radius:300px;border:1px solid rgba(17,17,17,.35);background:transparent;cursor:pointer;transition:background .2s,color .2s,border-color .2s;}
  .bf-cpdf .chips input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;}
  .bf-cpdf .chips label:has(input:checked){background:var(--ink);border-color:var(--ink);color:#fff;}
  .bf-cpdf .chips label:has(input:focus-visible){box-shadow:0 0 0 3px rgba(17,17,17,.25);}
  .bf-cpdf .bf-btn{display:inline-flex;align-items:center;justify-content:center;margin-top:8px;font-family:'RATI_v2',Georgia,serif;font-weight:300;font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:300px;padding:24px 30px;cursor:pointer;white-space:nowrap;transition:background .25s;}
  .bf-cpdf .bf-btn:hover{background:#2a2a2a;}
  .bf-cpdf .bf-btn[disabled]{opacity:.6;cursor:wait;}
  .bf-cpdf .fine{font-size:13px;color:var(--muted);line-height:1.6;margin:18px 0 0;}
  .bf-cpdf .bf-status{margin-top:14px;font-size:15px;min-height:1.4em;}
  .bf-cpdf .bf-status.err{color:#4A1414;}
  .bf-cpdf .bf-done{padding:12px 0;}
  .bf-cpdf .bf-done h3{font-family:'RATI_v2',Georgia,serif;font-weight:300;font-size:clamp(22px,1.66vw,26px);line-height:1.47;margin:0 0 .4em;color:var(--ink);}
  .bf-cpdf .bf-done p{margin:0;font-size:17px;line-height:1.8;}
  .bf-hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;}
  @media(max-width:700px){.bf-cpdf .grid{grid-template-columns:1fr;}.bf-cpdf .bf-btn{width:100%;padding:20px 18px;}}
</style>

<div class="bf-cpdf" id="bfCpd">
  <noscript><p>This form needs JavaScript. Please enable it, or email us at info@biofarm.co.uk.</p></noscript>
  <form id="bfCpdForm" method="post" novalidate>
    <div class="grid">
      <div><label for="bfCpdName">Name <span class="req">*</span></label><input id="bfCpdName" name="name" type="text" required maxlength="200" autocomplete="name"></div>
      <div><label for="bfCpdCompany">Company <span class="req">*</span></label><input id="bfCpdCompany" name="company" type="text" required maxlength="200" autocomplete="organization"></div>
      <div><label for="bfCpdRole">Role</label><input id="bfCpdRole" name="role" type="text" maxlength="120" autocomplete="organization-title"></div>
      <div><label for="bfCpdEmail">Work email <span class="req">*</span></label><input id="bfCpdEmail" name="email" type="email" required maxlength="320" autocomplete="email"></div>
      <div><label for="bfCpdPhone">Phone</label><input id="bfCpdPhone" name="phone" type="tel" maxlength="50" autocomplete="tel"></div>
      <div><label for="bfCpdSize">Team size</label>
        <select id="bfCpdSize" name="team_size">
          <option value="">Select</option><option value="1-5">1&ndash;5</option><option value="6-15">6&ndash;15</option><option value="16-40">16&ndash;40</option><option value="40+">40+</option>
        </select></div>
      <fieldset class="full">
        <legend>What field are you in? <span class="req">*</span></legend>
        <div class="chips">
          <label><input type="checkbox" name="fields" value="developer">Developer or promoter</label>
          <label><input type="checkbox" name="fields" value="other">Planner or consultant</label>
          <label><input type="checkbox" name="fields" value="landowner">Landowner</label>
          <label><input type="checkbox" name="fields" value="other">Other</label>
        </div>
      </fieldset>
      <div class="full"><label for="bfCpdMsg">What would you like the session to cover?</label><textarea id="bfCpdMsg" name="message" maxlength="5000"></textarea></div>
    </div>
    <!-- honeypot: humans never see or fill this -->
    <div class="bf-hp" aria-hidden="true"><label for="bfCpdWebsite">Website</label><input type="text" id="bfCpdWebsite" name="website" tabindex="-1" autocomplete="off"></div>
    <button type="submit" class="bf-btn" id="bfCpdSubmit">Arrange a session</button>
    <p class="fine">We&rsquo;ll come back to you to agree a date and tailor the session to your team.</p>
    <div class="bf-status" id="bfCpdStatus" role="alert" aria-live="polite"></div>
  </form>
</div>

<script>
(function () {
  var API_BASE = 'https://biofarm-api.onrender.com';
  var GA_ID = 'G-3MS9TLLZRN';

  var form = document.getElementById('bfCpdForm');
  var statusEl = document.getElementById('bfCpdStatus');
  var btn = document.getElementById('bfCpdSubmit');
  var startedAt = null;

  // wake a sleeping backend while the visitor is still typing
  try { fetch(API_BASE + '/healthz').catch(function () {}); } catch (e) {}

  form.addEventListener('focusin', function () {
    if (!startedAt) startedAt = Date.now();
  }, { once: true });

  var gaIds = {};
  if (typeof gtag === 'function') {
    try {
      gtag('get', GA_ID, 'client_id', function (v) { gaIds.client_id = v; });
      gtag('get', GA_ID, 'session_id', function (v) { gaIds.session_id = String(v); });
    } catch (e) {}
  }

  function readJSON(store, key) {
    try { return JSON.parse(store.getItem(key)) || null; } catch (e) { return null; }
  }
  function legacyUTM() {
    var out = {}, any = false;
    try {
      ['utm_source','utm_medium','utm_campaign','utm_term','utm_content'].forEach(function (k) {
        var v = sessionStorage.getItem(k);
        if (v) { out[k] = v.slice(0, 255); any = true; }
      });
    } catch (e) {}
    return any ? out : null;
  }
  function fail(msg) { statusEl.className = 'bf-status err'; statusEl.textContent = msg; }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    statusEl.className = 'bf-status';
    statusEl.textContent = '';

    if (!form.name.value.trim() || !form.company.value.trim()) return fail('Please add your name and company.');
    if (!form.email.value.trim() || !/.+@.+\..+/.test(form.email.value)) return fail('Please add a valid work email address.');
    var fields = Array.prototype.map.call(
      form.querySelectorAll('input[name=fields]:checked'), function (el) { return el.value; });
    fields = fields.filter(function (v, i) { return fields.indexOf(v) === i; }); // two chips map to "other"
    if (!fields.length) return fail('Please tell us what field you are in.');

    var payload = {
      name: form.name.value.trim(),
      company: form.company.value.trim(),
      role: form.role.value.trim() || null,
      email: form.email.value.trim(),
      phone: form.phone.value.trim() || null,
      fields: fields,
      team_size: form.team_size.value || null,
      message: form.message.value.trim() || null,
      website: form.website.value, // honeypot
      fill_ms: startedAt ? Date.now() - startedAt : null,
      page: location.pathname,
      attribution: readJSON(sessionStorage, 'bf_attr_last') || legacyUTM(),
      first_touch: readJSON(localStorage, 'bf_attr_first'),
      ga_client_id: gaIds.client_id || null,
      ga_session_id: gaIds.session_id || null
    };

    btn.disabled = true;
    btn.textContent = 'Sending…';
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 30000);

    fetch(API_BASE + '/v1/leads/cpd', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    }).then(function (resp) {
      clearTimeout(timer);
      if (resp.status === 429) throw new Error('rate');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: 'pipedrive_form_submit',
        formId: 'bng-cpd',
        formUUID: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now())
      });
      if (typeof gtag === 'function') {
        gtag('event', 'generate_lead', { lead_source: 'website_cpd_form' });
      }
      var wrap = document.getElementById('bfCpd');
      wrap.innerHTML = '<div class="bf-done" role="status" tabindex="-1"><h3>Thank you. We&rsquo;ll be in touch to arrange your session.</h3>' +
        '<p>We&rsquo;ll come back to you to agree a date and tailor the session to your team.</p></div>';
      var done = wrap.querySelector('.bf-done');
      if (done) done.focus();
    }).catch(function (err) {
      clearTimeout(timer);
      btn.disabled = false;
      btn.textContent = 'Arrange a session';
      fail(err && err.message === 'rate'
        ? 'A few too many attempts - please wait a minute and try again.'
        : 'Something went wrong sending your request - please try again, or email us at info@biofarm.co.uk.');
    });
  });
})();
</script>

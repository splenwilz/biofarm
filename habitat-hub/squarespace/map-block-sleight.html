<!-- SLEIGHT two-tier catchment map — paste into one Code Block on the Sleight item/page.
     Replace /s/bf-map-only.js with your uploaded file URL. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  .bf-map{position:relative;height:min(60vh,460px);border-radius:18px;overflow:hidden;isolation:isolate;border:1px solid rgba(33,33,33,.14);}
  .bf-map .leaflet-map{position:absolute;inset:0;background:#dfe6dc;}
  .bpin{display:block;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#71977A;border:2px solid #fff;box-shadow:0 2px 6px rgba(33,33,33,.35);}
  .srm-nbr{fill:url(#srmHatch);}
  .bf-legend{position:absolute;z-index:500;bottom:12px;left:12px;max-width:calc(100% - 24px);pointer-events:none;background:rgba(255,255,255,.94);border:1px solid rgba(33,33,33,.14);border-radius:12px;padding:8px 12px;font-size:.74rem;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;}
  .bf-legend .lg{display:flex;align-items:center;gap:7px;}
  .bf-legend .lg-pin{width:12px;height:12px;border-radius:50% 50% 50% 0;background:#71977A;transform:rotate(-45deg);}
  .bf-legend .lg-local{width:15px;height:15px;border-radius:4px;background:rgba(113,151,122,.4);border:1.5px solid #4c6b55;}
  .bf-legend .lg-nbr{width:15px;height:15px;border-radius:4px;border:1px solid #8a8f83;background:repeating-linear-gradient(45deg,rgba(92,122,100,.5) 0 2px,rgba(113,151,122,.07) 2px 6px);}
  @media(max-width:700px){.bf-legend{bottom:46px;font-size:.66rem;gap:3px 10px;padding:6px 10px;}}
</style>
<div class="bf-map">
  <div class="leaflet-map" data-mode="single" data-bank="sleight" data-tiles="muted"></div>
  <div class="bf-legend"><span class="lg"><span class="lg-pin"></span> Sleight Farm</span><span class="lg"><span class="lg-local"></span> Full value (local LPA &amp; NCA)</span><span class="lg"><span class="lg-nbr"></span> Neighbouring (0.75&times;)</span></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/s/bf-map-only.js"></script>

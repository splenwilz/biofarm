<!-- HUB MAP code island — paste into one Code Block on /habitat-banks.
     Replace /s/bf-map-only.js with the URL from Custom Files after uploading. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  .bf-map{position:relative;height:min(70vh,560px);border-radius:18px;overflow:hidden;isolation:isolate;border:1px solid rgba(33,33,33,.14);}
  .bf-map .leaflet-map{position:absolute;inset:0;background:#dfe6dc;}
  .bpin{display:block;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#71977A;border:2px solid #fff;box-shadow:0 2px 6px rgba(33,33,33,.35);}
  .ppin{display:block;width:13px;height:13px;border-radius:50%;background:#B3A379;border:2px solid #fff;box-shadow:0 0 0 1.5px #857A5E,0 2px 6px rgba(33,33,33,.3);}
  .bf-legend{position:absolute;z-index:500;bottom:12px;left:12px;max-width:calc(100% - 24px);pointer-events:none;background:rgba(255,255,255,.94);border:1px solid rgba(33,33,33,.14);border-radius:12px;padding:8px 12px;font-size:.74rem;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;}
  .bf-legend .lg{display:flex;align-items:center;gap:7px;}
  .bf-legend .lg-pin{width:12px;height:12px;border-radius:50% 50% 50% 0;background:#71977A;transform:rotate(-45deg);}
  .bf-legend .lg-ring{width:15px;height:15px;border-radius:50%;border:1.5px dashed #71977A;}
  .bf-legend .lg-pipe{width:15px;height:15px;border-radius:50%;border:1.5px dotted #857A5E;background:rgba(179,163,121,.45);}
  @media(max-width:700px){.bf-legend{bottom:46px;font-size:.66rem;gap:3px 10px;padding:6px 10px;}}
</style>
<div class="bf-map">
  <div class="leaflet-map" data-mode="all" data-tiles="muted"></div>
  <div class="bf-legend"><span class="lg"><span class="lg-pin"></span> Registered bank</span><span class="lg"><span class="lg-ring"></span> Full-value area (LPA + NCA)</span><span class="lg"><span class="lg-pipe"></span> In the pipeline</span></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/s/bf-map-only.js"></script>

<!-- ===================================================================
     BIOFARM dandelion-seed motif (SVG) — brand-inspired illustration.
     Scalable + tintable: colour comes from CSS `color` (currentColor), so the
     same asset works pale over a dark hero or green over a light section.
     Drop this whole block into a Code Block, or lift the <svg> into the injection.
     Swap for the designer's exact transparent asset later — same slots.
     =================================================================== -->
<style>
  /* the motif inherits `color`; set it per placement */
  .bf-drift{display:block;width:100%;height:auto;color:var(--bf-green,#71977A);}
  .bf-drift--pale{color:rgba(255,255,255,.55);}      /* over a dark hero/photo */
  .bf-drift--soft{color:rgba(113,151,122,.35);}       /* subtle light-section accent */
  /* corner accent: absolutely-place inside a position:relative section */
  .bf-drift-accent{position:absolute;top:8px;right:6%;width:min(340px,42vw);pointer-events:none;z-index:1;}
  @media(prefers-reduced-motion:no-preference){
    .bf-drift use{animation:bf-float 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
    .bf-drift use:nth-child(2){animation-delay:-2s} .bf-drift use:nth-child(3){animation-delay:-4s}
    .bf-drift use:nth-child(4){animation-delay:-1s} .bf-drift use:nth-child(5){animation-delay:-3s}
    @keyframes bf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  }
</style>

<!-- One drift composition. viewBox 600×180. Seeds float gently (reduced-motion safe). -->
<svg class="bf-drift" viewBox="0 0 600 180" role="img" aria-label="Drifting dandelion seeds" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="bf-seed" viewBox="0 0 100 140" overflow="visible">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <line x1="50" y1="40" x2="18" y2="28"/>
        <line x1="50" y1="40" x2="23" y2="19"/>
        <line x1="50" y1="40" x2="30" y2="12"/>
        <line x1="50" y1="40" x2="40" y2="8"/>
        <line x1="50" y1="40" x2="50" y2="6"/>
        <line x1="50" y1="40" x2="60" y2="8"/>
        <line x1="50" y1="40" x2="70" y2="12"/>
        <line x1="50" y1="40" x2="77" y2="19"/>
        <line x1="50" y1="40" x2="82" y2="28"/>
        <path d="M50 40 C 53 68 47 94 50 116"/>
      </g>
      <ellipse cx="50" cy="124" rx="2.1" ry="7.5" fill="currentColor"/>
    </symbol>
  </defs>
  <use href="#bf-seed" x="10"  y="20" width="86" height="120" transform="rotate(-8 53 80)"   opacity=".9"/>
  <use href="#bf-seed" x="170" y="55" width="60" height="84"  transform="rotate(14 200 97)"  opacity=".65"/>
  <use href="#bf-seed" x="300" y="10" width="48" height="67"  transform="rotate(-18 324 43)" opacity=".55"/>
  <use href="#bf-seed" x="410" y="60" width="70" height="98"  transform="rotate(6 445 109)"  opacity=".78"/>
  <use href="#bf-seed" x="520" y="25" width="44" height="62"  transform="rotate(22 542 56)"  opacity=".5"/>
</svg>

<!-- USAGE
  • Coming-soon hero backdrop: place <svg class="bf-drift bf-drift--pale bf-drift-accent"> inside the
    hero (its parent needs position:relative) so pale seeds drift over the photo/overlay.
  • Hub / light-section accent: <svg class="bf-drift bf-drift--soft bf-drift-accent"> in a corner.
  • Single seed: reuse just one <use href="#bf-seed" .../> at any size.
  Recolour with the `color` CSS property (currentColor drives the strokes + seed body).
-->

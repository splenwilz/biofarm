      .bindPopup('<b>'+b.name+'</b><br>'+b.region+'<br>Coming soon, units not yet available for allocation.'+'<br><span style="color:#5c7a64;">Full value once registered: '+srm.localLabel+'</span>'+'<br><a href="/contact">Register your interest &rarr;</a>');
    setTimeout(function () { map.invalidateSize(); }, 200);
  });
})();
</script>

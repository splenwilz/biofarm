<!-- HUB FINDER v2 (search rail + map, full prototype parity) — /habitat-banks.
     Self-contained: Search button, habitat chips, use-my-location, reset view.
     Region/habitat filter the map instantly; Squarespace summary cards below are
     hidden as a progressive enhancement (falls back safely). -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  @font-face{font-family:'RATI_v2';src:url('https://static1.squarespace.com/static/69145a3301c5b8505ba96fac/t/692088b0f9ba550c5a4e78c6/1763739824272/BauhausRatiDisplay-ExtraLight_v2.woff2') format('woff2');font-weight:300;font-display:swap;}
  .bf-finder{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:18px;align-items:stretch;}
  .bf-rail{background:#fff;border:1px solid rgba(33,33,33,.14);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;}
  .bf-rail label{display:flex;flex-direction:column;gap:6px;font-size:.72rem;letter-spacing:.08em;font-weight:700;color:#5f6659;}
  .bf-rail select{font-size:1rem;color:#212121;background:#F5F6F1;border:1px solid rgba(33,33,33,.14);border-radius:12px;padding:12px 14px;width:100%;}
  .bf-rail select:focus{outline:none;border-color:#71977A;box-shadow:0 0 0 3px rgba(113,151,122,.25);}
  .bf-btn{font-family:'RATI_v2',Georgia,serif;font-weight:300;font-size:18px;line-height:1;background:#212121;color:#fff;border:1.5px solid #212121;border-radius:25px;padding:14px 28px;width:100%;cursor:pointer;transition:background-color .3s;margin-top:16px;}
  .bf-btn:hover{background:#3a3a3a;}
  .bf-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
  .bf-chips .fchip{font-size:.82rem;padding:8px 15px;border-radius:20px;background:#fff;border:1px solid rgba(33,33,33,.18);color:#212121;cursor:pointer;transition:background .2s,color .2s;}
  .bf-chips .fchip:hover{border-color:#71977A;}
  .bf-chips .fchip.is-on{background:#212121;color:#fff;border-color:#212121;}
  .bf-count{font-size:.85rem;color:#5f6659;}
  .bf-actions{margin-top:20px;padding-top:16px;border-top:1px solid rgba(33,33,33,.10);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem;}
  .bf-actions button{background:none;border:none;padding:0;font-size:.9rem;color:#4c6b55;cursor:pointer;}
  .bf-actions #bfReset{color:#5f6659;text-decoration:underline;}
  .bf-geo{font-size:.8rem;color:#8a8f83;}
  .bf-links a{color:#4c6b55;font-size:.9rem;}
  .bf-map{position:relative;height:auto;min-height:540px;border-radius:18px;overflow:hidden;isolation:isolate;border:1px solid rgba(33,33,33,.14);}
  .bf-map .leaflet-map{position:absolute;inset:0;background:#dfe6dc;}
  .bf-resetview{position:absolute;z-index:500;top:12px;right:12px;background:rgba(255,255,255,.94);border:1px solid rgba(33,33,33,.14);border-radius:20px;padding:7px 14px;font-size:.76rem;font-weight:700;color:#212121;cursor:pointer;}
  .bpin{display:block;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#71977A;border:2px solid #fff;box-shadow:0 2px 6px rgba(33,33,33,.35);}
  .ppin{display:block;width:13px;height:13px;border-radius:50%;background:#B3A379;border:2px solid #fff;box-shadow:0 0 0 1.5px #857A5E,0 2px 6px rgba(33,33,33,.3);}
  /* legend now lives in the rail as a "Map key" (was a floating map overlay) */
  /* margin-top:auto anchors the Map key to the bottom so the rail fills the map's
     height exactly (align-items:stretch makes the two columns equal height) */
  .bf-legend{margin-top:auto;padding-top:16px;border-top:1px solid rgba(33,33,33,.10);font-size:.82rem;display:flex;flex-direction:column;gap:9px;color:#5b5f57;}
  .bf-legend .lg-title{font-size:.7rem;letter-spacing:.04em;font-weight:700;color:#8a8f83;margin-bottom:2px;}
  .bf-legend .lg{display:flex;align-items:center;gap:7px;}
  .bf-legend .lg-pin{width:12px;height:12px;border-radius:50% 50% 50% 0;background:#71977A;transform:rotate(-45deg);}
  .bf-legend .lg-ring{width:15px;height:15px;border-radius:50%;border:1.5px dashed #71977A;}
  .bf-legend .lg-pipe{width:15px;height:15px;border-radius:50%;border:1.5px dotted #857A5E;background:rgba(179,163,121,.45);}
  @media(max-width:820px){.bf-finder{grid-template-columns:1fr;} .bf-map{height:52vh;min-height:0;}}

  /* ===== bank card styling for the Squarespace summary grids on this page ===== */
  .summary-item{background:#fff;border:1px solid rgba(33,33,33,.14);border-radius:18px;overflow:hidden;transition:transform .15s,box-shadow .2s,border-color .2s;padding:0 !important;}
  .summary-item:hover{transform:translateY(-4px);box-shadow:0 26px 54px -30px rgba(33,33,33,.45);border-color:#71977A;}
  .summary-thumbnail-outer-container{margin:0 !important;padding:0 !important;}
  .summary-thumbnail-container{display:block;margin:0 !important;padding:0 !important;border-radius:0 !important;overflow:hidden;}
  .summary-thumbnail,.summary-thumbnail.img-wrapper,img.summary-thumbnail-image{border-radius:0 !important;}
  /* script-drawn registered cards (fallback when the block didn't load a bank past the 30-cap) */
  .bf-genthumb{display:block;line-height:0;}
  .bf-genthumb img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;}
  .summary-content{padding:18px 22px 24px;}
  .summary-title{font-family:'RATI_v2',Georgia,serif;font-weight:300;font-size:1.5rem;letter-spacing:-.01em;line-height:1.15;}
  .summary-title a{text-decoration:none;}
  .summary-excerpt,.summary-excerpt p{color:#5f6659;font-size:.92rem;line-height:1.5;margin:6px 0 0;}
  .summary-metadata-container{display:none !important;}
  /* exactly 3 cards per row at any screen width */
  .summary-item-list{display:grid !important;grid-template-columns:repeat(3,1fr) !important;gap:28px !important;height:auto !important;}
  .summary-item{position:static !important;float:none !important;width:auto !important;clear:none !important;transform:none !important;left:auto !important;top:auto !important;}
  @media (max-width:900px){.summary-item-list{grid-template-columns:repeat(2,1fr) !important;}}
  @media (max-width:600px){.summary-item-list{grid-template-columns:1fr !important;}}
  /* prototype card internals — pixel-exact to the approved design (base 18px) */
  .summary-content{padding:22px 24px 26px !important;}
  .summary-content .bf-eyebrow{font-size:13px;line-height:1.3;letter-spacing:.1em;font-weight:700;color:#71977A;margin:0 0 8px;}
  .summary-title{font-size:27px !important;}
  .bf-stats{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:16px;line-height:1.4;color:#5f6659;margin:10px 0 0;}
  .bf-stats b{color:#212121;font-weight:700;}
  .bf-pill{display:inline-block;font-size:12px;line-height:1.4;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:20px;background:rgba(113,151,122,.16);color:#5d8268;border:1px solid rgba(113,151,122,.4);}
  .bf-pill--soon{background:rgba(179,163,121,.22);color:#6d6448;border-color:#B3A379;}
  .bf-chiprow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;}
  .bf-chip{font-size:13px;line-height:1.5;padding:3px 10px;border-radius:20px;border:1px solid rgba(33,33,33,.12);color:#212121;background:#F5F6F1;}
  a.bf-cta{display:inline-block;margin-top:12px;font-family:'RATI_v2',Georgia,serif;font-size:18px;color:#212121;text-decoration:none;}
  a.bf-cta:hover{color:#4c6b55;}
  /* count + sort bar injected above the grid (matches prototype list-head) */
  .bf-gridhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;flex-wrap:wrap;}
  .bf-gh-count{font-size:.78rem;letter-spacing:.09em;font-weight:700;color:#5f6659;}
  .bf-gh-count b{color:#212121;}
  .bf-gh-sort{display:flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.08em;font-weight:700;color:#5f6659;}
  .bf-gh-sort select{font-family:inherit;font-size:.88rem;text-transform:none;letter-spacing:0;font-weight:400;color:#212121;border:1px solid rgba(33,33,33,.14);border-radius:10px;padding:7px 10px;background:#fff;cursor:pointer;}
  /* coming-soon cards: dashed stone border, stone eyebrow (matches prototype) */
  .summary-item[data-bf-soon]{border-style:dashed;border-color:#B3A379;}
  .summary-item[data-bf-soon] .bf-eyebrow{color:#857A5E;}
  /* "+N more coming soon" reveal card, lives inside the grid */
  .bf-more{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:300px;cursor:pointer;padding:24px;text-align:center;color:#212121;background:repeating-linear-gradient(45deg,rgba(179,163,121,.10) 0 12px,rgba(179,163,121,.03) 12px 24px);border:1px dashed #B3A379;border-radius:18px;}
  .bf-more .big{font-family:'RATI_v2',Georgia,serif;font-weight:300;font-size:42px;color:#857A5E;line-height:1;}
  .bf-more .lbl{font-size:12px;letter-spacing:.1em;font-weight:700;color:#857A5E;}
  .bf-more .cta{margin-top:4px;font-family:'RATI_v2',Georgia,serif;font-size:18px;}
  .bf-more:hover .cta{text-decoration:underline;}

      }
      // inject the count + sort bar once, inside the block wrapper above the grid
      // (kept inside the block's own flow so it doesn't fight Fluid Engine layout)
      if (!gridHead) buildGridHead();
      var wrap = target.closest('.summary-block-wrapper') || target.parentNode;
      if (gridHead && wrap && gridHead.parentNode !== wrap) {
        wrap.insertBefore(gridHead, wrap.firstChild);
      }
      if (!moreBtn) {
        moreBtn = document.createElement('button');
        moreBtn.type = 'button'; moreBtn.className = 'bf-more'; moreBtn.style.display = 'none';
        moreBtn.addEventListener('click', function () {
          var collapsing = soonExpanded;           // this click is "See less" when already expanded
          soonExpanded = !soonExpanded;
          filterCards(reg.value, hab.value);
          // On "See less" the rows above collapse, which would strand the viewport at the
          // page bottom — pull the reveal card (bottom of the grid) back into view.
          if (collapsing) { try { moreBtn.scrollIntoView({ behavior:'smooth', block:'center' }); } catch(e){ moreBtn.scrollIntoView(); } }
        });
      }
      target.appendChild(moreBtn);
    } catch (e) {}
  }

  function decorate() {
    try {
      document.querySelectorAll('.summary-item').forEach(function (it) {
        if (it.getAttribute('data-bf-done')) return;
        var sl = it.getAttribute('data-bf-slug');
        var a = it.querySelector('a[href*="/habitat-banks-lists/"]');
        if (!sl && a) sl = a.getAttribute('href').split('?')[0].split('/').filter(Boolean).pop();
        if (!sl) return;
        var preview = BF_PREVIEWS[sl] || null;
        var content = it.querySelector('.summary-content'); if (!content) return;
        var title = content.querySelector('.summary-title'); if (!title) return;
        var bank = null; BF_BANKS.forEach(function (b) { if (b.url.split('/').pop() === sl) bank = b; });
        if (!bank && preview) {
          var base = null; BF_BANKS.forEach(function (b) { if (b.id === preview.baseId) base = b; });
          if (base) { bank = {}; for (var k in base) bank[k] = base[k]; bank.name = preview.name; bank.url = preview.url; title.textContent = preview.name; }
        }
        var soon = null;
        if (!bank && typeof PIPELINE_SITES !== 'undefined') PIPELINE_SITES.forEach(function (p) { if (slug(p.name) === sl) soon = p; });
        if (!bank && !soon) return;
        it.setAttribute('data-bf-done', '1');
        it.setAttribute('data-bf-slug', sl);
        // registered cards link to their detail PAGE (bank.url), not the thin blog post
        if (bank) it.querySelectorAll('a[href*="/habitat-banks-lists/"]').forEach(function (link) { link.setAttribute('href', bank.url); });
        if (soon) it.setAttribute('data-bf-soon', '1');
        var ex = content.querySelector('.summary-excerpt'); if (ex) ex.style.display = 'none';
        var eb = document.createElement('div'); eb.className = 'bf-eyebrow';
        eb.innerHTML = bank ? bank.where : (soon.lpa + ' &middot; ' + soon.nca);
        content.insertBefore(eb, title);
        var st = document.createElement('div'); st.className = 'bf-stats';
        st.innerHTML = bank
          ? '<span><b>' + bank.area + '</b> habitat bank</span><span><b>' + bank.units + '</b> units</span>' + (preview ? '<span class="bf-pill bf-pill--soon">Lean preview</span>' : '<span class="bf-pill">Registered</span>')
          : '<span>New habitat bank in development</span><span class="bf-pill bf-pill--soon">Coming soon</span>';
        title.insertAdjacentElement('afterend', st);
        if (bank && bank.habitats) {
          var row = document.createElement('div'); row.className = 'bf-chiprow';
          bank.habitats.split(',').forEach(function (h) {
            h = h.trim(); if (!h) return;
            var c = document.createElement('span'); c.className = 'bf-chip';
            c.textContent = h.charAt(0).toUpperCase() + h.slice(1);
            row.appendChild(c);
          });
          st.insertAdjacentElement('afterend', row);
        }
        var cta = document.createElement('a'); cta.className = 'bf-cta';
        cta.href = bank ? bank.url : ('/habitat-banks-lists/' + sl);
        cta.innerHTML = bank ? (preview ? 'View lean version &rarr;' : 'View habitat bank &rarr;') : 'View site &amp; register interest &rarr;';
        content.appendChild(cta);
      });
    } catch (e) { /* enhancement only */ }
  }

  // Guarantee the registered banks: for any bank the Summary Block did NOT load
  // (e.g. pushed past the 30-item cap by pipeline growth), draw its card from the
  // bank data + photo. When the block loads all banks natively this adds nothing.
  function ensureRegisteredCards() {
    try {
      var lists = document.querySelectorAll('.summary-item-list');
      if (!lists.length) return;
      var target = lists[0];
      var present = {};
      document.querySelectorAll('.summary-item').forEach(function (it) {
        var s = itemSlug(it); if (s) present[s] = true;
      });
      BF_BANKS.forEach(function (b) {
        var sl = b.url.split('/').pop();
        if (present[sl]) return;                                   // native card already there
        if (document.querySelector('[data-bf-synth="' + sl + '"]')) return; // already drawn
        var card = document.createElement('div');
        card.className = 'summary-item summary-item-record-type-text';
        card.setAttribute('data-bf-synth', sl);
        card.setAttribute('data-bf-slug', sl);
        card.innerHTML =
          '<a class="summary-thumbnail-container bf-genthumb" href="' + b.url + '">'
          + '<img class="summary-thumbnail-image" src="' + b.img + '" alt="' + b.name + '"/></a>'
          + '<div class="summary-content">'
          + '<div class="summary-title"><a class="summary-title-link" href="' + b.url + '">' + b.name + '</a></div>'
          + '</div>';
        target.appendChild(card);
      });
    } catch (e) {}
  }

  function filterCards(r, h) {
    try {
      ensureRegisteredCards(); decorate(); arrange();
      var items = document.querySelectorAll('.summary-item');
      if (!items.length) return;
      var soonShown = 0, soonHidden = 0, banksShown = 0;
      items.forEach(function (it) {
        var meta = META[itemSlug(it)]; if (!meta) return;
        var ok;
        if (meta.soon) {
          ok = !h && (!r || meta.region === r); // habitats unconfirmed for pipeline
          if (ok && !soonExpanded && soonShown >= SOON_LIMIT) { ok = false; soonHidden++; }
          else if (ok) soonShown++;
        } else {
          ok = (!r || meta.region === r);
          if (ok && h) ok = meta.habitats.indexOf(h) !== -1;
          if (ok) banksShown++;
        }
        it.style.display = ok ? '' : 'none';
      });
      if (ghCount) ghCount.innerHTML = '<b>' + banksShown + '</b> registered habitat bank' + (banksShown === 1 ? '' : 's');
      if (moreBtn) {
        if (soonHidden > 0) {
          moreBtn.style.display = '';
          moreBtn.innerHTML = '<span class="big">+' + soonHidden + '</span><span class="lbl">more coming soon</span><span class="cta">See all &rarr;</span>';
        } else if (soonExpanded && soonShown > SOON_LIMIT) {
          moreBtn.style.display = '';
          moreBtn.innerHTML = '<span class="lbl">Showing all coming soon</span><span class="cta">Show fewer &uarr;</span>';
        } else moreBtn.style.display = 'none';
      }
    } catch (e) {}
  }

  [reg].forEach(function (s) { if (s) s.addEventListener('change', function(){ syncChips(); apply(); }); });
  chips.forEach(function (c) { c.addEventListener('click', function () { hab.value = c.getAttribute('data-hab'); syncChips(); apply(); }); });
  if (btn) btn.addEventListener('click', function () {
    apply();
    var target = document.querySelector('.summary-item') || document.querySelector('.bf-finder');
    if (target) target.scrollIntoView({ behavior:'smooth', block:'start' });
  });
  if (rst) rst.addEventListener('click', function () { reg.value=''; hab.value=''; syncChips(); if (geo) geo.textContent=''; apply(); });
  if (rvw) rvw.addEventListener('click', function () { map.flyToBounds(home, { padding:[40,40], duration:.5 }); });
  if (loc) loc.addEventListener('click', function () {
    if (!navigator.geolocation) { if (geo) geo.textContent = 'Location not supported.'; return; }
    if (geo) geo.textContent = 'Locating…';
    navigator.geolocation.getCurrentPosition(function (pos) {
      var ll = [pos.coords.latitude, pos.coords.longitude];
      try { L.marker(ll, { title:'You' }).addTo(map).bindPopup('You are here'); } catch (e) {}
      map.flyTo(ll, 8, { duration:.6 });
      if (geo) geo.textContent = 'Showing the map around you';
    }, function () { if (geo) geo.textContent = "Couldn't get your location."; });
  });

  var tries = 0, t = setInterval(function () { if (++tries > 10) clearInterval(t); filterCards(reg.value, hab.value); }, 800);
  setTimeout(function () { map.invalidateSize(); }, 200);
})();

</script>

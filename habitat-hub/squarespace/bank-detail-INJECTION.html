<!-- ===================================================================
     BANK DETAIL — shared design system (COLLECTION INJECTION)
     -------------------------------------------------------------------
     WHERE TO PASTE:  Squarespace → the Habitat Banks blog collection →
       Settings → Advanced → "Post Blog Item Code Injection"
     This loads on EVERY post in the collection, so the .bf-bank design is
     defined ONCE for all bank pages — no CSS in the section blocks.

     Typography/colour INHERIT the Squarespace theme (RATI / RATI_v2 / Inter,
     #111). Only custom components (hero, map wrap, cards, timeline, table,
     buttons) are styled here.

     Safe on coming-soon posts: the only rule that touches native post markup
     (hiding the post title) is guarded by :has(.bf-hero), so it applies ONLY
     on posts that contain the hero section. Posts without a hero keep their
     native title untouched.
     =================================================================== -->
<style>
  @font-face{font-family:'RATI_v2';src:url('https://static1.squarespace.com/static/69145a3301c5b8505ba96fac/t/692088b0f9ba550c5a4e78c6/1763739824272/BauhausRatiDisplay-ExtraLight_v2.woff2') format('woff2');font-weight:300;font-display:swap;}
  /* Inherit the theme's typography & colour — only design tokens live here. */
  .bf-bank{--bf-ink:#212121;--bf-green:#71977A;--bf-green-d:#5d8268;--bf-muted:#5b5f57;--bf-cream:#F5F6F1;--bf-cream2:#F7F8F3;--bf-white:#fff;--bf-hairline:rgba(33,33,33,.12);}
  .bf-bank *{box-sizing:border-box;}
  .bf-bank h2{margin:0 0 .4em;}
  .bf-bank p{margin:0 0 1em;}
  .bf-bank a{color:inherit;}
  .bf-bank .bf-eyebrow{letter-spacing:.02em;font-size:.82rem;font-weight:700;color:var(--bf-green);margin:0 0 1rem;}
  .bf-bank .measure{max-width:62ch;color:var(--bf-muted);}
  .bf-bank .inline-link{color:var(--bf-green-d);text-decoration:underline;}
  /* shared 1320px centred wrap + gutter — hero content and every section align.
     Padding is deliberately modest: each section is its own Code Block, so
     Squarespace adds ~34px of inter-block gap on top → total ≈ 34+34+34 ≈ 102px
     between sections. (If you ever recombine sections into one block, bump this.) */
  .bf-band{padding-block:clamp(18px,2.6vw,34px);max-width:1320px;margin-inline:auto;padding-inline:clamp(18px,3.2vw,44px);}
  /* cream bands are background boxes → give them a bit more internal padding */
  .bf-band--cream{background:var(--bf-cream2);border-radius:22px;padding-block:clamp(28px,3.4vw,44px);padding-inline:clamp(20px,3vw,44px);}
  .bf-split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,60px);align-items:center;}
  .bf-split img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}

  /* Immersive hero */
  .bf-hero{position:relative;color:#fff;overflow:hidden;isolation:isolate;display:flex;align-items:center;
    left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;width:100vw;max-width:100vw;border-radius:0;
    margin-top:-46px;} /* pull flush under the fixed 94px header (desktop-tuned) */
  .bf-hero__inner{max-width:1320px;margin-inline:auto;width:100%;padding:clamp(64px,10vw,132px) clamp(18px,3.2vw,44px);}
  /* Hide the native post title ONLY on posts that contain the hero. */
  :root:has(.bf-hero) .blog-item-top-wrapper{display:none !important;}
  /* Hide the post author profile on EVERY bank post (registered + coming-soon) —
     it's the internal post author, not visitor-facing bank info. */
  .blog-item-author-profile-wrapper{display:none !important;}
  .bf-hero__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;}
  .bf-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(33,33,33,.20),rgba(33,33,33,.78));z-index:-1;}
  .bf-hero .bf-eyebrow{color:var(--bf-cream);}
  /* hero title inherits theme h1 (RATI/200); we only cap the size + go white */
  .bf-hero__title{font-size:clamp(2.4rem,5vw,4rem);line-height:1.06;letter-spacing:-.015em;margin:0 0 .35em;color:#fff;max-width:18ch;}
  .bf-hero__sub{font-size:clamp(1.05rem,1.6vw,1.22rem);color:rgba(255,255,255,.92);max-width:54ch;margin:0;}
  .bf-keyfacts{display:flex;flex-wrap:wrap;gap:14px;margin:24px 0;}
  .bf-kf{background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:11px 18px;}
  .bf-kf .k{display:block;font-size:.68rem;letter-spacing:.1em;color:rgba(255,255,255,.78);}
  .bf-kf .v{display:block;font-family:'RATI_v2',Georgia,serif;font-weight:300;font-size:1.35rem;line-height:1.15;margin-top:3px;color:#fff;}
  .bf-hero__cta,.bf-cta__btns{display:flex;flex-wrap:wrap;gap:12px;}

  /* buttons — scoped under .bf-bank so their colour beats .bf-bank a{color:inherit} */
  .bf-bank .bf-btn-solid,.bf-bank .bf-btn-ghost{display:inline-block;font-family:'RATI_v2',Georgia,serif;font-weight:300;font-size:18px;line-height:1;text-decoration:none;border-radius:25px;padding:14px 28px;transition:background-color .3s,border-color .2s,transform .15s;}
  .bf-bank .bf-btn-solid{background:var(--bf-ink);color:#fff;border:1.5px solid var(--bf-ink);}
  .bf-bank .bf-btn-solid:hover{background:#3a3a3a;transform:translateY(-1px);}
  .bf-bank .bf-btn-ghost{background:transparent;color:var(--bf-ink);border:1.5px solid var(--bf-hairline);}
  .bf-bank .bf-btn-ghost:hover{border-color:var(--bf-green);background:var(--bf-cream);}
  .bf-hero .bf-btn-solid{background:var(--bf-cream);color:var(--bf-ink);border-color:var(--bf-cream);}
  .bf-hero .bf-btn-solid:hover{background:#fff;}
  .bf-hero .bf-btn-ghost{color:#fff;border-color:rgba(255,255,255,.55);}
  .bf-hero .bf-btn-ghost:hover{background:rgba(255,255,255,.14);border-color:#fff;}

  /* stat row */
  .bf-statrow{display:flex;flex-wrap:wrap;gap:26px 44px;margin-top:24px;}
  .bf-stat .v{font-family:'RATI_v2',Georgia,serif;font-weight:300;font-size:2rem;line-height:1;}
  .bf-stat .v small{font-size:1rem;}
  .bf-stat .k{display:block;font-size:.8rem;color:var(--bf-muted);letter-spacing:.06em;margin-top:5px;}

  /* chips */
  .bf-chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px;}
  .bf-chip{font-size:.82rem;background:var(--bf-white);border:1px solid var(--bf-hairline);border-radius:20px;padding:6px 13px;color:var(--bf-ink);}
  .bf-note{font-size:.85rem;color:#8a8f83;font-style:italic;}

  /* unit table */
  .bf-utable{width:100%;border-collapse:collapse;margin-top:22px;background:var(--bf-white);border:1px solid var(--bf-hairline);border-radius:14px;overflow:hidden;}
  .bf-utable th,.bf-utable td{text-align:left;padding:13px 18px;border-bottom:1px solid var(--bf-hairline);font-size:.98rem;}
  .bf-utable th{font-size:.72rem;letter-spacing:.08em;color:var(--bf-muted);font-weight:700;background:var(--bf-cream2);}
  .bf-utable tr:last-child td{border-bottom:none;}

  /* pillars */
  .bf-pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3vw,36px);margin-top:34px;}
  .bf-pillar{border-top:2px solid var(--bf-green);padding-top:18px;}
  .bf-pillar h3{font-size:1.25rem;margin:0 0 .3em;}
  .bf-pillar p{font-size:.98rem;color:var(--bf-muted);margin:0;}

  /* timeline */
  .bf-tl{margin-top:34px;max-width:760px;}
  .bf-tl__item{position:relative;padding:0 0 28px 34px;border-left:2px solid var(--bf-hairline);}
  .bf-tl__item:last-child{border-left-color:transparent;padding-bottom:0;}
  .bf-tl__item::before{content:"";position:absolute;left:-8px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--bf-green);border:3px solid var(--bf-cream2);}
  .bf-tl__phase{font-size:.7rem;letter-spacing:.1em;font-weight:700;color:var(--bf-green);}
  .bf-tl__item h3{font-size:1.25rem;margin:.2em 0 .3em;}
  .bf-tl__item p{color:var(--bf-muted);margin:0;font-size:1rem;}

  /* species */
  .bf-species{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;}
  .bf-sp{background:var(--bf-white);border:1px solid var(--bf-hairline);border-radius:14px;padding:18px 20px;}
  .bf-sp .tag{font-size:.66rem;letter-spacing:.1em;font-weight:700;color:var(--bf-green);}
  .bf-sp h3{font-size:1.15rem;margin:.15em 0 .25em;}
  .bf-sp p{font-size:.92rem;color:var(--bf-muted);margin:0;}

  /* gallery */
  .bf-gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:14px;margin-top:24px;}
  .bf-gallery img{width:100%;height:100%;object-fit:cover;display:block;}
  .bf-gallery img.g-lg{grid-column:span 2;grid-row:span 2;}

  /* resources */
  .bf-res-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px;}
  .bf-res{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--bf-white);border:1px solid var(--bf-hairline);border-radius:14px;padding:18px 22px;text-decoration:none;transition:border-color .2s,transform .15s;}
  .bf-res:hover{border-color:var(--bf-green);transform:translateY(-2px);}
  .bf-res .rt{font-family:'RATI_v2',Georgia,serif;font-size:1.15rem;}
  .bf-res .rm{font-size:.8rem;color:var(--bf-muted);}
  .bf-res .dl{font-size:.78rem;font-weight:700;letter-spacing:.05em;color:var(--bf-green-d);white-space:nowrap;}

  /* related banks */
  .bf-rel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px;}
  .bf-rel{display:block;text-decoration:none;background:var(--bf-white);border:1px solid var(--bf-hairline);border-radius:16px;overflow:hidden;transition:transform .15s,box-shadow .2s,border-color .2s;}
  .bf-rel:hover{transform:translateY(-3px);box-shadow:0 20px 44px -28px rgba(33,33,33,.4);border-color:var(--bf-green);}
  .bf-rel img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;}
  .bf-rel .rb{padding:16px 18px;}
  .bf-rel .rg{font-size:.72rem;letter-spacing:.1em;font-weight:700;color:var(--bf-green);}
  .bf-rel h3{font-size:1.3rem;margin:.15em 0 0;}

  /* closing CTA (ink) */
  .bf-cta{background:var(--bf-ink);color:var(--bf-cream);border-radius:22px;padding:clamp(30px,4vw,60px);}
  .bf-cta .bf-eyebrow{color:var(--bf-green);}
  .bf-cta h2{color:#fff;}
  .bf-cta p{color:rgba(245,246,241,.85);max-width:56ch;}
  .bf-cta .bf-btn-solid{background:var(--bf-cream);color:var(--bf-ink);border-color:var(--bf-cream);}
  .bf-cta .bf-btn-solid:hover{background:#fff;}
  .bf-cta .bf-btn-ghost{color:#fff;border-color:rgba(255,255,255,.5);}
  .bf-cta .bf-btn-ghost:hover{background:rgba(255,255,255,.12);border-color:#fff;}
  .bf-ilinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .bf-ilinks a{text-decoration:none;font-size:.9rem;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:8px 15px;}
  .bf-ilinks a:hover{background:rgba(255,255,255,.16);}

  @media(max-width:820px){.bf-pillars,.bf-species{grid-template-columns:1fr 1fr;} .bf-rel-grid{grid-template-columns:1fr;} }
  @media(max-width:760px){.bf-split{grid-template-columns:1fr;} .bf-split .img-first{order:-1;} .bf-hero{min-height:clamp(400px,74vh,540px);} .bf-res-grid{grid-template-columns:1fr;} .bf-gallery{grid-template-columns:1fr 1fr;grid-auto-rows:130px;} }
  @media(max-width:560px){.bf-species{grid-template-columns:1fr;} }

  /* reveal-on-scroll — the .bf-reveal class is added by the JS below, so with no
     JS (or reduced-motion) everything is fully visible; nothing ever stays hidden. */
  .bf-reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease;}
  .bf-reveal.bf-in{opacity:1;transform:none;}
  @media(prefers-reduced-motion:reduce){.bf-reveal{opacity:1 !important;transform:none !important;transition:none !important;}}
</style>
<script>
/* Motion: subtle hero parallax + reveal-on-scroll. Respects prefers-reduced-motion.
   Fails safe — if this never runs, sections stay visible and the hero is static. */
(function(){
  if (window.__bfMotion) return; window.__bfMotion = 1;
  var mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  if (mq && mq.matches) return;
  function init(){
    var hero = document.querySelector('.bf-hero'), img = hero && hero.querySelector('.bf-hero__img');
    if (hero && img){
      img.style.height = '120%'; img.style.top = '-10%';
      var ticking = false;
      function move(){ img.style.transform = 'translateY(' + (hero.getBoundingClientRect().top * -0.10) + 'px)'; ticking = false; }
      window.addEventListener('scroll', function(){ if(!ticking){ ticking = true; requestAnimationFrame(move); } }, { passive:true });
      move();
    }
    var bands = [].slice.call(document.querySelectorAll('.bf-bank .bf-band'));
    if (bands.length && 'IntersectionObserver' in window){
      bands.forEach(function(b){ b.classList.add('bf-reveal'); });
      var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add('bf-in'); io.unobserve(e.target); } }); }, { rootMargin:'0px 0px -8% 0px', threshold:0.08 });
      bands.forEach(function(b){ io.observe(b); });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

<!-- BASICS PILL-LINKS, the three inline links under "What is a habitat bank?".
     Squarespace's default Button block is too heavy for this look, so these are
     brand-matched pill links. Drop into a Code Block directly under the intro
     text in the left column. Scoped under .bf-ilinks (no clashes). Edit the
     labels/URLs right here. -->
<style>
  .bf-ilinks{--bf-ink:#212121;--bf-green:#71977A;--bf-hairline:rgba(33,33,33,.12);--bf-cream:#F5F6F1;
    display:flex;flex-wrap:wrap;gap:10px;margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
  .bf-ilinks a{text-decoration:none;font-size:.9rem;line-height:1.2;color:var(--bf-ink);background:#fff;
    border:1px solid var(--bf-hairline);border-radius:20px;padding:8px 15px;transition:border-color .2s,background .2s;}
  .bf-ilinks a:hover{border-color:var(--bf-green);background:var(--bf-cream);}
</style>

<div class="bf-ilinks">

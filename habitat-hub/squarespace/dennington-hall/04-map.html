          + '<rect width="7" height="7" fill="#71977A" fill-opacity="0.06"/>'
          + '<line x1="0" y1="0" x2="0" y2="7" stroke="#5c7a64" stroke-width="1.3" stroke-opacity="0.5"/></pattern>';
        svg.insertBefore(defs, svg.firstChild);
      }
    }, 50);
    L.marker([b.lat, b.lng], { icon:L.divIcon({ className:'', html:'<span class="bpin"></span>', iconSize:[22,22], iconAnchor:[11,22], popupAnchor:[0,-20] }) }).addTo(map)
      .bindPopup('<b>'+b.name+'</b><br>'+b.region+'<br>Coming soon, units not yet available for allocation.'+'<br><span style="color:#5c7a64;">Full value once registered: '+srm.localLabel+'</span>'+'<br><a href="/contact">Register your interest &rarr;</a>');
    setTimeout(function () { map.invalidateSize(); }, 200);
  });
})();
</script>

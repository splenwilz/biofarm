<!-- CONTACT FORM v1.3 - /contact (and the same section reused on /about), green section (replaces the main Pipedrive embed).
     v1.1 adds "Where did you hear about us?" (optional dropdown; the answer keys match app/schemas.py HeardAbout).
     v1.2: choosing "Other" reveals a text box for their own words (sent as heard_about_other).
     v1.3: "I am a..." grows to Developer / Planning consultant / Ecologist / Landowner / Other (keys match
     app/schemas.py FieldChoice; the old values are unchanged); the heard-about list is the agreed nine.
     Paste into a Code Block where the "Get in touch" embed currently sits.
     Posts to https://biofarm-api.onrender.com (lead DB + Pipedrive + GA4). -->
<style>
  @font-face{font-family:'RATI_v2';src:url('https://static1.squarespace.com/static/69145a3301c5b8505ba96fac/t/692088b0f9ba550c5a4e78c6/1763739824272/BauhausRatiDisplay-ExtraLight_v2.woff2') format('woff2');font-weight:300;font-display:swap;}
  .bf-form{max-width:560px;margin:0 auto;color:#212121;}
  .bf-form h3{margin:0 0 22px;color:#212121;} /* typography inherited from the site theme */
  .bf-form label,.bf-form legend{display:block;font-size:.95rem;margin:0 0 6px;color:#212121;}
  .bf-form .req{color:#212121;}
  .bf-field{margin:0 0 18px;}
  .bf-field[hidden]{display:none;}
  .bf-form input[type=text],.bf-form input[type=email],.bf-form input[type=tel],.bf-form textarea{width:100%;box-sizing:border-box;font-family:inherit;font-size:1rem;color:#212121;background:#fff;border:1px solid rgba(33,33,33,.14);border-radius:12px;padding:12px 14px;}
  .bf-form select{width:100%;box-sizing:border-box;font-family:inherit;font-size:1rem;color:#212121;background:#fff;border:1px solid rgba(33,33,33,.14);border-radius:12px;padding:12px 40px 12px 14px;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 4l4 4 4-4' fill='none' stroke='%23212121' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;background-size:12px;cursor:pointer;}
  .bf-form textarea{min-height:120px;resize:vertical;}
  .bf-form input:focus,.bf-form textarea:focus,.bf-form select:focus{outline:none;border-color:#212121;box-shadow:0 0 0 3px rgba(33,33,33,.22);}
  .bf-form fieldset{border:none;margin:0 0 18px;padding:0;}
  .bf-chips{display:flex;flex-wrap:wrap;gap:10px;}
  .bf-chips label{display:inline-flex;align-items:center;gap:8px;margin:0;font-size:.92rem;padding:9px 16px;border-radius:20px;background:transparent;border:1px solid rgba(33,33,33,.35);color:#212121;cursor:pointer;transition:background .2s,color .2s,border-color .2s;}
  .bf-chips input{position:absolute;opacity:0;pointer-events:none;}
  .bf-chips label:has(input:checked){background:#212121;border-color:#212121;color:#fff;}
  .bf-chips label:has(input:focus-visible){box-shadow:0 0 0 3px rgba(33,33,33,.25);}
  .bf-radios label{display:flex;align-items:center;gap:10px;margin:0 0 8px;cursor:pointer;}
  .bf-radios input{accent-color:#212121;width:18px;height:18px;}
  .bf-form .bf-btn{font-family:'RATI_v2',Georgia,serif;font-weight:300;font-size:18px;line-height:1;background:#212121;color:#fff;border:1.5px solid #212121;border-radius:25px;padding:14px 34px;cursor:pointer;transition:background-color .3s;}
  .bf-form .bf-btn:hover{background:#3a3a3a;}
  .bf-form .bf-btn[disabled]{opacity:.6;cursor:wait;}
  .bf-note{font-size:.8rem;color:rgba(33,33,33,.72);margin-top:14px;}
  .bf-status{margin-top:14px;font-size:.95rem;min-height:1.4em;}
  .bf-status.err{color:#4A1414;}
  .bf-done{text-align:center;padding:40px 0;}
  .bf-done h3{color:#212121;margin:0 0 10px;}
  /* honeypot: parked off-screen, invisible to humans, present for bots */
  .bf-hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;}
</style>

<div class="bf-form" id="bfContact">
  <h3>Get in touch</h3>
  <noscript><p style="color:#212121;">This form needs JavaScript. Please enable it, or contact us by email instead.</p></noscript>
  <form id="bfContactForm" method="post" novalidate>
    <div class="bf-field">
      <label for="bfName">Name <span class="req">*</span></label>
      <input type="text" id="bfName" name="name" required maxlength="200" autocomplete="name">
    </div>
    <div class="bf-field">
      <label for="bfEmail">Email <span class="req">*</span></label>
      <input type="email" id="bfEmail" name="email" required maxlength="320" autocomplete="email">
    </div>
    <div class="bf-field">
      <label for="bfPhone">Phone (optional)</label>
      <input type="tel" id="bfPhone" name="phone" maxlength="50" autocomplete="tel">
    </div>
    <fieldset>
      <legend>I am a... <span class="req">*</span></legend>
      <div class="bf-chips">
        <label><input type="checkbox" name="fields" value="developer">Developer</label>
        <label><input type="checkbox" name="fields" value="planning_consultant">Planning consultant</label>
        <label><input type="checkbox" name="fields" value="ecologist">Ecologist</label>
        <label><input type="checkbox" name="fields" value="landowner">Landowner</label>
        <label><input type="checkbox" name="fields" value="other">Other</label>
      </div>
    </fieldset>
    <div class="bf-field">
      <label for="bfHeardAbout">Where did you hear about us? (optional)</label>
      <select id="bfHeardAbout" name="heard_about">
        <option value="">Please choose</option>
        <option value="search">Search engine</option>
        <option value="linkedin">LinkedIn</option>
        <option value="referral">Recommended by someone</option>
        <option value="event">Event or trade show</option>
        <option value="newsletter">Biofarm newsletter</option>
        <option value="press">Press or article</option>
        <option value="marketplace">BNG marketplace or listing site</option>
        <option value="ai">AI assistant (like ChatGPT)</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="bf-field" id="bfHeardOtherField" hidden>
      <label for="bfHeardOther">Tell us where (optional)</label>
      <input type="text" id="bfHeardOther" name="heard_about_other" maxlength="200" autocomplete="off">
    </div>
    <div class="bf-field">
      <label for="bfMessage">Your Message (optional)</label>
      <textarea id="bfMessage" name="message" maxlength="5000"></textarea>
    </div>
    <fieldset class="bf-radios">
      <legend>Please plant me on the newsletter list - I accept the <a href="/privacy-policy" style="color:#212121;">Privacy Policy</a> <span class="req">*</span></legend>
      <label><input type="radio" name="newsletter" value="yes" required>Yes please</label>
      <label><input type="radio" name="newsletter" value="no">No thank you</label>
    </fieldset>
    <div class="bf-hp" aria-hidden="true">
      <label for="bfWebsite">Website</label>
      <input type="text" id="bfWebsite" name="website" tabindex="-1" autocomplete="off">
    </div>
    <button type="submit" class="bf-btn" id="bfSubmit">Submit</button>
    <p class="bf-status" id="bfStatus" role="status" aria-live="polite"></p>
    <p class="bf-note">Required fields are marked with *. We never ask for sensitive information through this form.</p>
  </form>
</div>

<script>
(function () {
  var API_BASE = 'https://biofarm-api.onrender.com';
  var GA_ID = 'G-3MS9TLLZRN';

  var form = document.getElementById('bfContactForm');
  var statusEl = document.getElementById('bfStatus');
  var btn = document.getElementById('bfSubmit');
  var startedAt = null;

  // wake a sleeping backend while the visitor is still typing
  try { fetch(API_BASE + '/healthz').catch(function () {}); } catch (e) {}

  // "Other" opens a box for their own words; any other answer hides and empties it.
  // Focus stays on the dropdown (WCAG 3.2.2: changing a control must not move focus).
  var heardOtherField = document.getElementById('bfHeardOtherField');
  form.heard_about.addEventListener('change', function () {
    var other = form.heard_about.value === 'other';
    heardOtherField.hidden = !other;
    if (!other) form.heard_about_other.value = '';
  });

  form.addEventListener('focusin', function () {
    if (!startedAt) startedAt = Date.now();
  }, { once: true });

  // harvest GA ids early - gtag('get') is async
  var gaIds = {};
  if (typeof gtag === 'function') {
    try {
      gtag('get', GA_ID, 'client_id', function (v) { gaIds.client_id = v; });
      gtag('get', GA_ID, 'session_id', function (v) { gaIds.session_id = String(v); });
    } catch (e) {}
  }

  function readJSON(store, key) {
    try { return JSON.parse(store.getItem(key)) || null; } catch (e) { return null; }
  }
  function legacyUTM() {
    var out = {}, any = false;
    try {
      ['utm_source','utm_medium','utm_campaign','utm_term','utm_content'].forEach(function (k) {
        var v = sessionStorage.getItem(k);
        if (v) { out[k] = v.slice(0, 255); any = true; }
      });
    } catch (e) { /* storage blocked */ }
    return any ? out : null;
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    statusEl.className = 'bf-status';
    statusEl.textContent = '';

    var fields = Array.prototype.map.call(
      form.querySelectorAll('input[name=fields]:checked'), function (el) { return el.value; });
    var newsletter = form.querySelector('input[name=newsletter]:checked');

    if (!form.name.value.trim() || !form.email.value.trim() || !/.+@.+\..+/.test(form.email.value)) {
      statusEl.className = 'bf-status err';
      statusEl.textContent = 'Please add your name and a valid email address.';
      return;
    }
    if (!fields.length) {
      statusEl.className = 'bf-status err';
      statusEl.textContent = 'Please tell us what field you are in.';
      return;
    }
    if (!newsletter) {
      statusEl.className = 'bf-status err';
      statusEl.textContent = 'Please choose a newsletter preference.';
      return;
    }

    var payload = {
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      phone: form.phone.value.trim() || null,
      fields: fields,
      message: form.message.value.trim() || null,
      heard_about: form.heard_about.value || null,
      heard_about_other: form.heard_about.value === 'other' ? (form.heard_about_other.value.trim().slice(0, 200) || null) : null,
      newsletter_opt_in: newsletter.value === 'yes',
      website: form.website.value, // honeypot
      fill_ms: startedAt ? Date.now() - startedAt : null,
      page: location.pathname,
      attribution: readJSON(sessionStorage, 'bf_attr_last') || legacyUTM(),
      first_touch: readJSON(localStorage, 'bf_attr_first'),
      ga_client_id: gaIds.client_id || null,
      ga_session_id: gaIds.session_id || null
    };

    btn.disabled = true;
    btn.textContent = 'Sending…';
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 30000);

    fetch(API_BASE + '/v1/leads/contact', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    }).then(function (resp) {
      clearTimeout(timer);
      if (resp.status === 429) throw new Error('rate');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      // Same dataLayer event the old Pipedrive iframe listener pushed - keeps
      // the existing GTM conversion tags (Google Ads, LinkedIn, Microsoft UET,
      // GA4) firing after the embed is gone. Triggers match on formId.
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: 'pipedrive_form_submit',
        formId: '6Nc0UIRKyFh5WCZWHeAoPMOAybnpTGvuiSneYf8ugdgRTHdNGrwN59Ak9ZW2dMYid5',
        formUUID: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now())
      });
      if (typeof gtag === 'function') {
        gtag('event', 'generate_lead', { lead_source: 'website_contact_form' });
      }
      var wrap = document.getElementById('bfContact');
      wrap.innerHTML = '<div class="bf-done" role="status" tabindex="-1"><h3>Thank you - message received.</h3>' +
        '<p>We’ll pave the right path forward and get back to you shortly.</p></div>';
      var done = wrap.querySelector('.bf-done');
      if (done) done.focus();
    }).catch(function (err) {
      clearTimeout(timer);
      btn.disabled = false;
      btn.textContent = 'Submit';
      statusEl.className = 'bf-status err';
      statusEl.textContent = err && err.message === 'rate'
        ? 'A few too many attempts - please wait a minute and try again.'
        : 'Something went wrong sending your message - please try again, or email us directly at info@biofarm.co.uk.';
    });
  });
})();
</script>

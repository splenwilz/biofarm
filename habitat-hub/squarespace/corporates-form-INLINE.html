<!-- CORPORATES "CHAT TO CHRIS" SECTION v4 - /corporates, the whole green section in one block (replaces the
     native blocks on the left - "Chat to Chris", Chris Scott's photo, his title, the line - AND the last live
     Pipedrive embed on the site, webforms.pipedrive.com/f/c6xq6U2Z..., found in the 11 Nov 2026 form audit).
     Left: the headings inherit the theme's own h2/h4 sizes so the column reads as the native blocks did
     (user, 11 Nov). Right: "Get in touch" over the form in our contact/about styling (cream fields,
     small-caps labels, pill button), unchanged.
     Same questions as the embed (name, email, phone, message, newsletter) plus the optional "Where did you hear
     about us?" the contact form asks. No "I am a" chips: the page is for corporates, so `fields` is sent empty
     and Client Type stays blank in Pipedrive (same choice as the CPD form); `page` is /corporates so the
     dashboard can tell these leads apart.
     Paste into a Code Block that spans the full width of the green section, then delete the old text blocks,
     the image block and the embed.
     Posts to https://biofarm-api.onrender.com/v1/leads/contact (lead DB + Pipedrive + GA4). -->
<style>
  @font-face{font-family:'RATI_v2';src:url('https://static1.squarespace.com/static/69145a3301c5b8505ba96fac/t/692088b0f9ba550c5a4e78c6/1763739824272/BauhausRatiDisplay-ExtraLight_v2.woff2') format('woff2');font-weight:300;font-display:swap;}
  /* Squarespace gives this section's desktop grid 26 rows with a minimum height each (container width x 0.0215),
     and the Code Block spans 24 of them, so on wide screens the rows add up to more than the form and the
     leftover shows as empty green under Submit. Zeroing the scaling factor lets the rows size to the content.
     Scoped to this section's own Fluid Engine class (fe-68527fc...); if the section is ever rebuilt, update it. */
  .fe-68527fc173c0d74a0f3692a3{--row-height-scaling-factor:0 !important;}
  /* the section: statement left at the theme's own heading sizes, our form right */
  .bf-talk{display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(48px,7vw,120px);row-gap:48px;align-items:start;color:#212121;}
  .bf-talk *{box-sizing:border-box;}
  .bf-talk .bf-side h2,.bf-talk .bf-side h4{color:#212121;}
  .bf-talk .bf-side h2{margin:0 0 .9em;}
  .bf-talk .bf-who{display:flex;align-items:center;gap:16px;margin:0 0 24px;}
  .bf-talk .bf-who img{width:clamp(96px,9vw,140px);height:clamp(96px,9vw,140px);border-radius:50%;object-fit:cover;flex:none;display:block;}
  .bf-talk .bf-who h4{margin:0;}
  .bf-talk .bf-side .bf-lead{margin:0;max-width:24ch;}
  .bf-talk .bf-form-title{font-family:'RATI_v2',Georgia,serif;font-weight:300;font-size:24px;line-height:1.2;letter-spacing:0;margin:0 0 18px;color:#212121;}
  @media(max-width:900px){.bf-talk{grid-template-columns:1fr;row-gap:40px;}}
  .bf-form{max-width:560px;margin:0;color:#212121;font-size:17px;}
  .bf-form label,.bf-form legend{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;line-height:1.4;margin:0 0 8px;padding:0;color:#212121;}
  .bf-form .req{color:#212121;}
  .bf-field{margin:0 0 22px;}
  .bf-field[hidden]{display:none;}
  .bf-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 20px;margin:0 0 22px;}
  .bf-two .bf-field{margin:0;display:flex;flex-direction:column;justify-content:flex-end;}
  @media(max-width:600px){.bf-two{grid-template-columns:1fr;}}
  .bf-form input[type=text],.bf-form input[type=email],.bf-form input[type=tel],.bf-form textarea,.bf-form select{display:block;width:100%;box-sizing:border-box;min-height:54px;font-family:inherit;font-size:17px;line-height:1.3;font-weight:300;color:#212121;background:#F7F8F3;border:1px solid rgba(17,17,17,.28);border-radius:3px;padding:14px 16px;transition:background .2s,border-color .2s;}
  .bf-form input::placeholder,.bf-form textarea::placeholder{color:rgba(17,17,17,.5);}
  .bf-form input:hover,.bf-form textarea:hover,.bf-form select:hover{border-color:rgba(17,17,17,.55);}
  .bf-form input:focus,.bf-form textarea:focus,.bf-form select:focus{outline:none;background:#fff;border-color:#212121;}
  .bf-form select{appearance:none;-webkit-appearance:none;padding-right:44px;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 4l4 4 4-4' fill='none' stroke='%23212121' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 16px center;background-size:12px;}
  .bf-form textarea{min-height:104px;resize:vertical;}
  .bf-form fieldset{border:none;margin:0 0 22px;padding:0;min-width:0;}
  .bf-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .bf-chips label{position:relative;display:inline-flex;align-items:center;gap:8px;margin:0;min-height:42px;font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;line-height:1;padding:0 16px;border-radius:300px;background:transparent;border:1px solid rgba(17,17,17,.55);color:#212121;cursor:pointer;transition:background .2s,color .2s,border-color .2s;}
  .bf-chips label:hover{border-color:#212121;}
  .bf-chips input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;}
  .bf-chips label:has(input:checked){background:#212121;border-color:#212121;color:#F7F8F3;}
  .bf-chips label:has(input:focus-visible){outline:2px solid #212121;outline-offset:3px;}
  .bf-radios legend{font-size:14px;letter-spacing:0;text-transform:none;font-weight:300;line-height:1.5;margin:0 0 6px;}
  .bf-radios .bf-radio-row{display:flex;gap:22px;flex-wrap:wrap;}
  .bf-radios label{display:inline-flex;align-items:center;gap:10px;margin:0;min-height:40px;font-size:15px;letter-spacing:0;text-transform:none;font-weight:300;cursor:pointer;}
  .bf-radios input{appearance:none;-webkit-appearance:none;width:18px;height:18px;min-height:0;margin:0;border:1px solid #212121;border-radius:50%;background:#F7F8F3;padding:0;}
  .bf-radios input:checked{box-shadow:inset 0 0 0 4px #F7F8F3;background:#212121;}
  .bf-closing{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;}
  .bf-form .bf-btn{font-family:'RATI_v2',Georgia,serif;font-weight:300;font-size:19px;letter-spacing:.03em;line-height:1.2;min-height:58px;background:#212121;color:#F7F8F3;border:0;border-radius:300px;padding:0 36px;cursor:pointer;transition:background-color .3s;}
  .bf-form .bf-btn:hover{background:#2a2a2a;}
  .bf-form .bf-btn[disabled]{opacity:.6;cursor:wait;}
  .bf-note{font-size:12px;line-height:1.5;color:#212121;margin:0;max-width:36ch;}
  .bf-status{margin-top:14px;font-size:16px;min-height:1.4em;}
  .bf-status:empty{margin:0;min-height:0;}
  .bf-status.err{color:#4A1414;}
  .bf-done{padding:20px 0;}
  .bf-done h3{color:#212121;margin:0 0 10px;}
  /* honeypot: parked off-screen, invisible to humans, present for bots */
  .bf-hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;}
</style>

<div class="bf-talk">
  <div class="bf-side">
    <h2>Chat to Chris</h2>
    <div class="bf-who">
      <img src="https://images.squarespace-cdn.com/content/v1/6818f9d9bff1414041f33bf3/6fd78baa-5a2e-4238-8c5f-4a7878226afa/Biofarm+Chris+Scott+Chief+Commercial+Officer?format=500w" alt="Chris Scott" width="140" height="140" loading="lazy">
      <h4>Chris Scott,<br>Chief Commercial Officer</h4>
    </div>
    <h4 class="bf-lead">Want to invest in nature? Get in touch with Chris.</h4>
  </div>
  <div class="bf-form" id="bfContact">
    <h3 class="bf-form-title">Get in touch</h3>
    <noscript><p style="color:#212121;">This form needs JavaScript. Please enable it, or contact us by email instead.</p></noscript>
  <form id="bfContactForm" method="post" novalidate>
    <div class="bf-field">
      <label for="bfName">Name <span class="req">*</span></label>
      <input type="text" id="bfName" name="name" required maxlength="200" autocomplete="name" placeholder="Your name">
    </div>
    <div class="bf-field">
      <label for="bfEmail">Email <span class="req">*</span></label>
      <input type="email" id="bfEmail" name="email" required maxlength="320" autocomplete="email" placeholder="you@company.co.uk">
    </div>
    <div class="bf-field">
      <label for="bfPhone">Phone (optional)</label>
      <input type="tel" id="bfPhone" name="phone" maxlength="50" autocomplete="tel" placeholder="+44">
    </div>
    <div class="bf-field">
      <label for="bfHeardAbout">Where did you hear about us? (optional)</label>
      <select id="bfHeardAbout" name="heard_about">
        <option value="">Please choose</option>
        <option value="search">Search engine</option>
        <option value="linkedin">LinkedIn</option>
        <option value="referral">Recommended by someone</option>
        <option value="event">Event or trade show</option>
        <option value="newsletter">Biofarm newsletter</option>
        <option value="press">Press or article</option>
        <option value="marketplace">BNG marketplace or listing site</option>
        <option value="ai">AI assistant (like ChatGPT)</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="bf-field" id="bfHeardOtherField" hidden>
      <label for="bfHeardOther">Tell us where (optional)</label>
      <input type="text" id="bfHeardOther" name="heard_about_other" maxlength="200" autocomplete="off" placeholder="A talk, a colleague, a podcast…">
    </div>
    <div class="bf-field">
      <label for="bfMessage">Your Message (optional)</label>
      <textarea id="bfMessage" name="message" maxlength="5000" rows="3" placeholder="What you’re looking to do, and how we can help…"></textarea>
    </div>
    <fieldset class="bf-radios">
      <legend>Please plant me on the newsletter list - I accept the <a href="/privacy-policy" style="color:#212121;">Privacy Policy</a> <span class="req">*</span></legend>
      <div class="bf-radio-row">
        <label><input type="radio" name="newsletter" value="yes" required>Yes please</label>
        <label><input type="radio" name="newsletter" value="no">No thank you</label>
      </div>
    </fieldset>
    <div class="bf-hp" aria-hidden="true">
      <label for="bfWebsite">Website</label>
      <input type="text" id="bfWebsite" name="website" tabindex="-1" autocomplete="off">
    </div>
    <div class="bf-closing">
      <p class="bf-note">Required fields are marked with *. We never ask for sensitive information through this form.</p>
      <button type="submit" class="bf-btn" id="bfSubmit">Submit</button>
    </div>
    <p class="bf-status" id="bfStatus" role="status" aria-live="polite"></p>
  </form>
  </div>
</div>

<script>
(function () {
  var API_BASE = 'https://biofarm-api.onrender.com';
  var GA_ID = 'G-3MS9TLLZRN';

  var form = document.getElementById('bfContactForm');
  var statusEl = document.getElementById('bfStatus');
  var btn = document.getElementById('bfSubmit');
  var startedAt = null;

  // wake a sleeping backend while the visitor is still typing
  try { fetch(API_BASE + '/healthz').catch(function () {}); } catch (e) {}

  // "Other" opens a box for their own words; any other answer hides and empties it.
  // Focus stays on the dropdown (WCAG 3.2.2: changing a control must not move focus).
  var heardOtherField = document.getElementById('bfHeardOtherField');
  form.heard_about.addEventListener('change', function () {
    var other = form.heard_about.value === 'other';
    heardOtherField.hidden = !other;
    if (!other) form.heard_about_other.value = '';
  });

  form.addEventListener('focusin', function () {
    if (!startedAt) startedAt = Date.now();
  }, { once: true });

  // harvest GA ids early - gtag('get') is async
  var gaIds = {};
  if (typeof gtag === 'function') {
    try {
      gtag('get', GA_ID, 'client_id', function (v) { gaIds.client_id = v; });
      gtag('get', GA_ID, 'session_id', function (v) { gaIds.session_id = String(v); });
    } catch (e) {}
  }

  function readJSON(store, key) {
    try { return JSON.parse(store.getItem(key)) || null; } catch (e) { return null; }
  }
  function legacyUTM() {
    var out = {}, any = false;
    try {
      ['utm_source','utm_medium','utm_campaign','utm_term','utm_content'].forEach(function (k) {
        var v = sessionStorage.getItem(k);
        if (v) { out[k] = v.slice(0, 255); any = true; }
      });
    } catch (e) { /* storage blocked */ }
    return any ? out : null;
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    statusEl.className = 'bf-status';
    statusEl.textContent = '';

    var fields = []; // no "I am a" chips on this page; Client Type stays blank (see header comment)
    var newsletter = form.querySelector('input[name=newsletter]:checked');

    if (!form.name.value.trim() || !form.email.value.trim() || !/.+@.+\..+/.test(form.email.value)) {
      statusEl.className = 'bf-status err';
      statusEl.textContent = 'Please add your name and a valid email address.';
      return;
    }
    if (!newsletter) {
      statusEl.className = 'bf-status err';
      statusEl.textContent = 'Please choose a newsletter preference.';
      return;
    }

    var payload = {
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      phone: form.phone.value.trim() || null,
      fields: fields,
      message: form.message.value.trim() || null,
      heard_about: form.heard_about.value || null,
      heard_about_other: form.heard_about.value === 'other' ? (form.heard_about_other.value.trim().slice(0, 200) || null) : null,
      newsletter_opt_in: newsletter.value === 'yes',
      website: form.website.value, // honeypot
      fill_ms: startedAt ? Date.now() - startedAt : null,
      page: location.pathname,
      attribution: readJSON(sessionStorage, 'bf_attr_last') || legacyUTM(),
      first_touch: readJSON(localStorage, 'bf_attr_first'),
      ga_client_id: gaIds.client_id || null,
      ga_session_id: gaIds.session_id || null
    };

    btn.disabled = true;
    btn.textContent = 'Sending…';
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 30000);

    fetch(API_BASE + '/v1/leads/contact', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    }).then(function (resp) {
      clearTimeout(timer);
      if (resp.status === 429) throw new Error('rate');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      // Same dataLayer event the old Pipedrive iframe listener pushed - keeps
      // the existing GTM conversion tags (Google Ads, LinkedIn, Microsoft UET,
      // GA4) firing after the embed is gone. Triggers match on formId.
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: 'pipedrive_form_submit',
        formId: 'c6xq6U2ZgZsYzP7sTV9sp1JNf1jZv4XQmpemdonWoDPME6uB9kaw09suHSNrkesouf', // the retired Corporates embed's id, so GTM sees what the iframe listener used to report
        formUUID: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now())
      });
      if (typeof gtag === 'function') {
        gtag('event', 'generate_lead', { lead_source: 'website_corporate_form' });
      }
      var wrap = document.getElementById('bfContact');
      wrap.innerHTML = '<div class="bf-done" role="status" tabindex="-1"><h3>Thank you - message received.</h3>' +
        '<p>Chris will be in touch shortly.</p></div>';
      var done = wrap.querySelector('.bf-done');
      if (done) done.focus();
    }).catch(function (err) {
      clearTimeout(timer);
      btn.disabled = false;
      btn.textContent = 'Submit';
      statusEl.className = 'bf-status err';
      statusEl.textContent = err && err.message === 'rate'
        ? 'A few too many attempts - please wait a minute and try again.'
        : 'Something went wrong sending your message - please try again, or email us directly at info@biofarm.co.uk.';
    });
  });
})();
</script>
